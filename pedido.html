<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Pedido</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Expediente</h1>

<div id="pedido"></div>

<h2>Eventos del expediente</h2>
<div id="eventos"></div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("data/pedidos.json")
  .then(response => response.json())
  .then(data => {

    let pedido = data.find(p => p.id === id);

    let contenedor = document.getElementById("pedido");

    if(pedido){

      contenedor.innerHTML = `
        <h2>${pedido.resumen}</h2>
        <p><b>Entidad:</b> ${pedido.entidad}</p>
        <p><b>Fecha solicitud:</b> ${pedido.fecha_solicitud}</p>
        <p><b>Resultado:</b> ${pedido.resultado}</p>
        <p><b>Estado actual:</b> ${pedido.estado_actual}</p>
        <p>${pedido.detalle}</p>
      `;

    }

});

  fetch("data/eventos.json")
  .then(response => response.json())
  .then(data => {

    let eventos = data.filter(e => e.pedido_id === id);

    let contenedor = document.getElementById("eventos");

    eventos.forEach(evento => {

      let div = document.createElement("div");

      div.innerHTML = `
        <p><b>${evento.tipo_evento}</b> — ${evento.resultado}</p>
        <p>${evento.detalle}</p>
        <hr>
      `;

      contenedor.appendChild(div);

    });

});

</script>

</body>

</html>
