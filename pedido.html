<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Expediente</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<p><a href="index.html" class="volver">← Volver a la página principal</a></p>

<h1>Expediente</h1>

<div id="pedido"></div>

<h2>Eventos del expediente</h2>
<div id="eventos"></div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

/* =========================
   CARGAR PEDIDO
========================= */

fetch("data/pedidos.json")
  .then(response => response.json())
  .then(data => {

    let pedido = data.find(p => p.id === id);
    let contenedor = document.getElementById("pedido");

    if(pedido){

      contenedor.innerHTML = `
        <h2>${pedido.resumen}</h2>
        <p><b>Entidad:</b> ${pedido.entidad}</p>
        <p><b>Fecha solicitud:</b> ${pedido.fecha_solicitud}</p>
        <p><b>Resultado:</b> ${pedido.resultado}</p>
        <p><b>Estado actual:</b> ${pedido.estado_actual}</p>
        <p>${pedido.detalle}</p>
      `;

    } else {

      contenedor.innerHTML = "<p>Pedido no encontrado.</p>";

    }

});


/* =========================
   CARGAR EVENTOS + DOCUMENTOS
========================= */

fetch("data/eventos.json")
  .then(response => response.json())
  .then(eventos => {

    let eventosPedido = eventos.filter(e => e.pedido_id === id);
    let contenedor = document.getElementById("eventos");

    fetch("data/documentos.json")
      .then(response => response.json())
      .then(documentos => {

        eventosPedido.forEach(evento => {

          let divEvento = document.createElement("div");

          divEvento.innerHTML = `
            <p><b>${evento.fecha}</b> — ${evento.tipo_evento} — ${evento.resultado}</p>
            <p>${evento.detalle}</p>
          `;

          contenedor.appendChild(divEvento);

          /* buscar documentos del evento */

          let docs = documentos.filter(d =>
            d.pedido_id === id && d.evento_tipo === evento.tipo_evento
          );

         docs.forEach(doc => {
         
           let docDiv = document.createElement("div");
         
           docDiv.innerHTML = `
             📄 <a href="docs/${doc.archivo}" target="_blank">${doc.titulo}</a>
           `;
         
           contenedor.appendChild(docDiv);
         
         });

          let hr = document.createElement("hr");
          contenedor.appendChild(hr);

        });

      });

});

</script>

</body>

</html>
