<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
   
<title>Expediente</title>
   
<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@700&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header">
  <div class="header-wrap">
    <div class="contacto">
      contacto: <a href="mailto:ernestocabralm@gmail.com">ernestocabralm@gmail.com</a>
    </div>
  </div>
</header>

<p><a href="index.html" class="volver">← Volver a la página principal</a></p>

<main>
   
<h1>Expediente</h1>

<div id="pedido"></div>

<h2>Eventos del expediente</h2>
<div id="eventos"></div>

</main>

<script>

/* =========================
   FORMATEAR FECHA
========================= */

function formatearFecha(fecha) {

  if(!fecha || !fecha.includes("-")) return fecha;

  let partes = fecha.split("-");
  return `${partes[2]}/${partes[1]}/${partes[0]}`;

}

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

/* =========================
   CARGAR PEDIDO
========================= */

fetch("data/pedidos.json")
  .then(response => response.json())
  .then(data => {

    let pedido = data.find(p => p.id === id);
    let contenedor = document.getElementById("pedido");

    if(pedido){

      contenedor.innerHTML = `
        <h2>${pedido.resumen}</h2>
        <p><b>Entidad:</b> ${pedido.entidad}</p>
        <p><b>Fecha solicitud:</b> ${formatearFecha(pedido.fecha_solicitud)}</p>
        <p><b>Resultado:</b> ${pedido.resultado}</p>
        <p><b>Estado actual:</b> ${pedido.estado_actual}</p>
        
        <p><b>Información solicitada:</b></p>
        <p>${pedido.detalle}</p>
      `;

    } else {

      contenedor.innerHTML = "<p>Pedido no encontrado.</p>";

    }

});


/* =========================
   CARGAR EVENTOS + DOCUMENTOS
========================= */

fetch("data/eventos.json")
  .then(response => response.json())
  .then(eventos => {

    let eventosPedido = eventos.filter(e => e.pedido_id === id);

    eventosPedido.sort((a, b) => {

     let fechaA = new Date(a.fecha);
     let fechaB = new Date(b.fecha);
   
     if(fechaA.getTime() === fechaB.getTime()){
       return (b.orden || 0) - (a.orden || 0);
     }
   
     return fechaB - fechaA;
   
   });

    let contenedor = document.getElementById("eventos");

    fetch("data/documentos.json")
      .then(response => response.json())
      .then(documentos => {

        eventosPedido.forEach(evento => {

          let divEvento = document.createElement("div");
            divEvento.className = "timeline-evento";
            
            divEvento.innerHTML = `
              <div class="timeline-dot"></div>
            
              <div class="timeline-card">
                <div class="timeline-fecha">${formatearFecha(evento.fecha)}</div>
                <div class="timeline-tipo">${evento.tipo_evento} — ${evento.resultado}</div>
                <div class="timeline-detalle">${evento.detalle}</div>
              </div>
            `;

          contenedor.appendChild(divEvento);

          /* buscar documentos del evento */

          let docs = documentos.filter(d =>
            d.pedido_id === id && d.evento_tipo === evento.tipo_evento
          );

          docs.forEach(doc => {

            let docDiv = document.createElement("div");

            docDiv.innerHTML = `
              <a href="docs/${doc.archivo}" target="_blank">📄 ${doc.titulo}</a>
            `;

            divEvento.querySelector(".timeline-card").appendChild(docDiv);

          });

        });

      });

});

</script>

</body>

</html>
